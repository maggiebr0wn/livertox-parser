[project]
name = "livertox-extraction"
version = "0.1.0"
description = "Pipeline to extract structured hepatotoxicity data from LiverTox XML files"
requires-python = ">=3.8"
dependencies = [
    "anthropic>=0.18.0",
    "python-dotenv>=1.0.0",
    "lxml>=4.9.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
    "jinja2>=3.0.0",
    "plotly>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[project.scripts]
livertox-extract = "livertox_extraction.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
